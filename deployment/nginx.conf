server {
  listen 80;
  server_name lecompteestbon.wissamkazan.ai;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  if ($http_x_forwarded_proto = http) { return 308 https://lecompteestbon.wissamkazan.ai$request_uri; }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self'; img-src 'self'; font-src 'self'; worker-src 'self'; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  # Permit the existing Cloudflare Web Analytics automatic beacon injection.
  # Keep normal revalidation; no duplicate analytics script is embedded in HTML.
  add_header Cache-Control "public, no-cache" always;
  location ~ /\. { deny all; }
  location / { try_files $uri $uri/ =404; }
}
