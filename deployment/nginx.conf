server {
  listen 80;
  server_name lecompteestbon.wissamkazan.ai;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  if ($http_x_forwarded_proto = http) { return 308 https://lecompteestbon.wissamkazan.ai$request_uri; }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  add_header Cache-Control "public, no-cache, no-transform" always;
  location ~ /\. { deny all; }
  location / { try_files $uri $uri/ =404; }
}
